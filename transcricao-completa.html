<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcrição SIGA – Microfone + Áudio da Chamada</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      color: #333;
      padding: 20px;
      max-width: 620px;
      margin: 0 auto;
    }
    h2 { text-align: center; margin-bottom: 6px; font-size: 22px; }
    .subtitulo { text-align: center; color: #666; font-size: 13px; margin-bottom: 18px; }

    .modos {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }
    .modo-btn {
      flex: 1;
      padding: 14px 10px;
      border: 2px solid #ddd;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      text-align: center;
      font-size: 14px;
      transition: 0.2s;
    }
    .modo-btn:hover { border-color: #007bff; }
    .modo-btn.ativo {
      border-color: #007bff;
      background: #e8f0fe;
      font-weight: bold;
    }
    .modo-btn span { display: block; font-size: 22px; margin-bottom: 4px; }

    #status {
      text-align: center;
      font-size: 14px;
      margin-bottom: 12px;
      min-height: 22px;
      font-weight: bold;
    }
    #status.gravando { color: #dc3545; }
    #status.parado { color: #28a745; }

    textarea {
      width: 100%;
      height: 240px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      resize: vertical;
      margin-bottom: 16px;
      line-height: 1.45;
    }

    .botoes {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 16px;
    }
    button {
      padding: 13px 20px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      min-width: 150px;
    }
    #btnGravar { background: #dc3545; color: white; }
    #btnGravar.gravando { background: #6c757d; }
    #btnEnviar { background: #28a745; color: white; }
    #btnFechar { background: #6c757d; color: white; }

    .aviso {
      padding: 14px;
      background: #fff8e1;
      border: 1px solid #ffc107;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }
    .aviso b { color: #856404; }
  </style>
</head>
<body>

  <h2>🎤 Transcrição SIGA</h2>
  <p class="subtitulo">Escolha o modo e inicie a gravação</p>

  <!-- Seleção de Modo -->
  <div class="modos">
    <div class="modo-btn ativo" id="modoMic" onclick="selecionarModo('mic')">
      <span>🎤</span>
      Microfone<br>
      <small style="font-weight:normal;color:#666;">Seu microfone real</small>
    </div>
    <div class="modo-btn" id="modoChamada" onclick="selecionarModo('chamada')">
      <span>🎧</span>
      Áudio da Chamada<br>
      <small style="font-weight:normal;color:#666;">Google Meet + VB-Cable</small>
    </div>
  </div>

  <div id="status" class="parado">Pronto para gravar</div>

  <textarea id="texto" placeholder="O texto reconhecido aparecerá aqui..."></textarea>

  <div class="botoes">
    <button id="btnGravar" onclick="toggleGravacao()">🎤 Iniciar</button>
    <button id="btnEnviar" onclick="enviarParaSistema()">✅ Enviar para o Sistema</button>
    <button id="btnFechar" onclick="window.close()">Fechar</button>
  </div>

  <div class="aviso" id="avisoModo">
    <b>Modo atual: Microfone</b><br>
    Use este modo quando quiser transcrever o que <b>você</b> está falando ou o paciente presencial.
  </div>

<script>
  let recognition = null;
  let gravando = false;
  let textoFinal = '';
  let modoAtual = 'mic';   // 'mic' ou 'chamada'

  const textarea = document.getElementById('texto');
  const statusEl = document.getElementById('status');
  const btnGravar = document.getElementById('btnGravar');
  const avisoModo = document.getElementById('avisoModo');

  function selecionarModo(modo) {
    if (gravando) {
      alert('Pare a gravação antes de trocar o modo.');
      return;
    }
    modoAtual = modo;

    document.getElementById('modoMic').classList.toggle('ativo', modo === 'mic');
    document.getElementById('modoChamada').classList.toggle('ativo', modo === 'chamada');

    if (modo === 'mic') {
      avisoModo.innerHTML = `
        <b>Modo atual: Microfone</b><br>
        Use este modo quando quiser transcrever o que <b>você</b> está falando ou o paciente presencial.
      `;
    } else {
      avisoModo.innerHTML = `
        <b>Modo atual: Áudio da Chamada</b><br>
        Antes de iniciar, configure no Windows o microfone padrão como <b>CABLE Output (VB-Audio Virtual Cable)</b>.<br>
        No Google Meet, deixe o seu microfone real selecionado.
      `;
    }
  }

  function toggleGravacao() {
    if (gravando) {
      parar();
    } else {
      iniciar();
    }
  }

  function iniciar() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert('Seu navegador não suporta reconhecimento de voz. Use o Chrome.');
      return;
    }

    // Continua de onde parou
    textoFinal = textarea.value.trim();
    if (textoFinal && !textoFinal.endsWith(' ')) {
      textoFinal += ' ';
    }

    recognition = new SpeechRecognition();
    recognition.lang = 'pt-BR';
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onstart = () => {
      gravando = true;
      btnGravar.textContent = '⏹ Parar';
      btnGravar.classList.add('gravando');
      statusEl.textContent = modoAtual === 'chamada' 
        ? '● Gravando áudio da chamada...' 
        : '● Gravando microfone...';
      statusEl.className = 'gravando';
    };

    recognition.onresult = (event) => {
      let interim = '';

      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          textoFinal += transcript + ' ';
        } else {
          interim += transcript;
        }
      }

      textarea.value = textoFinal + interim;
      textarea.scrollTop = textarea.scrollHeight;
    };

    recognition.onerror = (event) => {
      console.error('Erro:', event.error);
      if (event.error === 'not-allowed') {
        alert('Permissão de microfone negada. Verifique as configurações do navegador e do Windows.');
      }
      if (event.error !== 'no-speech' && event.error !== 'aborted') {
        parar();
      }
    };

    recognition.onend = () => {
      if (gravando) {
        try { recognition.start(); } catch(e) {}
      }
    };

    try {
      recognition.start();
    } catch (e) {
      alert('Erro ao iniciar o microfone. Verifique se o dispositivo está correto no Windows.');
    }
  }

  function parar() {
    gravando = false;
    if (recognition) {
      recognition.onend = null;
      recognition.stop();
      recognition = null;
    }
    btnGravar.textContent = '🎤 Iniciar';
    btnGravar.classList.remove('gravando');
    statusEl.textContent = 'Gravação parada';
    statusEl.className = 'parado';
    textarea.value = textoFinal.trim();
  }

  function enviarParaSistema() {
    const texto = textarea.value.trim();
    if (!texto) {
      alert('Nenhum texto para enviar.');
      return;
    }

    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({
        tipo: 'TRANSCRICAO_SIGA',
        texto: texto
      }, '*');

      statusEl.textContent = 'Texto enviado com sucesso!';
      statusEl.className = 'parado';
      setTimeout(() => window.close(), 900);
    } else {
      alert('Não foi possível encontrar a janela do sistema. Feche este popup e tente novamente pelo Módulo Clínico.');
    }
  }

  window.addEventListener('load', () => {
    if (!window.opener) {
      statusEl.textContent = 'Abra esta página pelo botão do Módulo Clínico';
    }
  });
</script>
</body>
</html>
