<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcrição de Voz – SIGA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      color: #333;
      padding: 20px;
      max-width: 520px;
      margin: 0 auto;
    }
    h2 { text-align: center; margin-bottom: 8px; font-size: 20px; }
    .subtitulo { text-align: center; color: #666; font-size: 13px; margin-bottom: 20px; }
    #status {
      text-align: center;
      font-size: 14px;
      margin-bottom: 12px;
      min-height: 22px;
      font-weight: bold;
    }
    #status.gravando { color: #dc3545; }
    #status.parado { color: #28a745; }
    textarea {
      width: 100%;
      height: 220px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      resize: vertical;
      margin-bottom: 16px;
    }
    .botoes {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      min-width: 140px;
    }
    #btnGravar { background: #dc3545; color: white; }
    #btnGravar.gravando { background: #6c757d; }
    #btnEnviar { background: #28a745; color: white; }
    #btnFechar { background: #6c757d; color: white; }
    .aviso {
      margin-top: 18px;
      padding: 12px;
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <h2>🎤 Transcrição de Voz</h2>
  <p class="subtitulo">Fale normalmente. O texto será enviado para o Módulo Clínico.</p>

  <div id="status" class="parado">Pronto para gravar</div>

  <textarea id="texto" placeholder="O texto reconhecido aparecerá aqui..."></textarea>

  <div class="botoes">
    <button id="btnGravar" onclick="toggleGravacao()">🎤 Iniciar</button>
    <button id="btnEnviar" onclick="enviarParaSistema()">✅ Enviar para o Sistema</button>
    <button id="btnFechar" onclick="window.close()">Fechar</button>
  </div>

  <div class="aviso">
    <b>Dica:</b> Clique em <b>Iniciar</b>, fale, clique em <b>Parar</b> e depois em <b>Enviar para o Sistema</b>.  
    Você também pode editar o texto antes de enviar.
  </div>

<script>
  let recognition = null;
  let gravando = false;
  let textoFinal = '';

  const textarea = document.getElementById('texto');
  const statusEl = document.getElementById('status');
  const btnGravar = document.getElementById('btnGravar');

  function toggleGravacao() {
    if (gravando) {
      parar();
    } else {
      iniciar();
    }
  }

  function iniciar() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert('Seu navegador não suporta reconhecimento de voz. Use o Chrome.');
      return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = 'pt-BR';
    recognition.continuous = true;
    recognition.interimResults = true;

    // Guarda o que já está escrito
    textoFinal = textarea.value.trim();
    if (textoFinal && !textoFinal.endsWith(' ')) textoFinal += ' ';

    recognition.onstart = () => {
      gravando = true;
      btnGravar.textContent = '⏹ Parar';
      btnGravar.classList.add('gravando');
      statusEl.textContent = '● Gravando... fale agora';
      statusEl.className = 'gravando';
    };

    recognition.onresult = (event) => {
      let interim = '';
      let final = '';

      for (let i = event.resultIndex; i < event.results.length; i++) {
        const t = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          final += t + ' ';
        } else {
          interim += t;
        }
      }

      textarea.value = textoFinal + final + interim;
      textarea.scrollTop = textarea.scrollHeight;
    };

    recognition.onerror = (event) => {
      console.error(event.error);
      if (event.error === 'not-allowed') {
        alert('Permissão de microfone negada. Permita o acesso ao microfone nesta página.');
      }
      parar();
    };

    recognition.onend = () => {
      // Se ainda estiver marcado como gravando, reinicia (alguns navegadores param após silêncio)
      if (gravando) {
        try { recognition.start(); } catch(e) {}
      }
    };

    try {
      recognition.start();
    } catch (e) {
      alert('Erro ao iniciar o microfone.');
    }
  }

  function parar() {
    gravando = false;
    if (recognition) {
      recognition.stop();
      recognition = null;
    }
    btnGravar.textContent = '🎤 Iniciar';
    btnGravar.classList.remove('gravando');
    statusEl.textContent = 'Gravação parada';
    statusEl.className = 'parado';
    textarea.value = textarea.value.trim();
  }

  function enviarParaSistema() {
    const texto = textarea.value.trim();
    if (!texto) {
      alert('Nenhum texto para enviar.');
      return;
    }

    // Envia o texto para a janela que abriu este popup
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({
        tipo: 'TRANSCRICAO_SIGA',
        texto: texto
      }, '*');   // o Apps Script valida a origem no lado dele

      statusEl.textContent = 'Texto enviado com sucesso!';
      statusEl.className = 'parado';

      // Fecha o popup após 1 segundo
      setTimeout(() => window.close(), 900);
    } else {
      alert('Não foi possível encontrar a janela do sistema. Feche este popup e tente novamente.');
    }
  }

  // Aviso se a página for aberta diretamente (sem ser popup)
  window.addEventListener('load', () => {
    if (!window.opener) {
      statusEl.textContent = 'Abra esta página pelo botão do Módulo Clínico';
    }
  });
</script>
</body>
</html>
